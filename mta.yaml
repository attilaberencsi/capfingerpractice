_schema-version: 3.3.0
ID: incident-management-2601
description: A simple CAP project.
version: 1.0.0
modules:
- name: incident-management-2601-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: incident-management-2601-db
  - name: incident-management-2601-auth
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    readiness-health-check-http-endpoint: /health
    readiness-health-check-type: http
  build-parameters:
    builder: npm
- name: incident-management-2601-db-deployer
  type: hdb
  path: gen/db
  requires:
  - name: incident-management-2601-db
  parameters:
    buildpack: nodejs_buildpack
- name: incident-management-2601-destination-content
  type: com.sap.application.content
  requires:
  - name: incident-management-2601-destination-service
    parameters:
      content-target: true
  - name: incident-management-2601_html_repo_host
    parameters:
      service-key:
        name: incident-management-2601_html_repo_host-key
  - name: incident-management-2601-auth
    parameters:
      service-key:
        name: incident-management-2601-auth-key
  parameters:
    content:
      instance:
        destinations:
        - Name: incident_2601_incident_management_2601_html_repo_host
          ServiceInstanceName: incident-management-2601-html5-app-host-service
          ServiceKeyName: incident-management-2601_html_repo_host-key
          sap.cloud.service: incident2601
        - Authentication: OAuth2UserTokenExchange
          Name: incident_2601_incident_management_2601_auth
          ServiceInstanceName: incident-management-2601-auth
          ServiceKeyName: incident-management-2601-auth-key
          sap.cloud.service: incident2601
        existing_destinations_policy: ignore
  build-parameters:
    no-source: true
- name: incident-management-2601-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: incident-management-2601_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - incidents.zip
      name: incidentmanagementincidents
      target-path: resources/
- name: incidentmanagementincidents
  type: html5
  path: app/incidents
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm ci
    - npm run build
    supported-platforms: []
resources:
- name: incident-management-2601-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
- name: incident-management-2601-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      tenant-mode: dedicated
      xsappname: incident-management-2601-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: incident-management-2601-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    service: destination
    service-plan: lite
    service-name: incident-management-2601-destination-service    
    config:
      HTML5Runtime_enabled: true
      version: 1.0.0
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          - Authentication: NoAuthentication
            HTML5.DynamicDestination: true
            HTML5.ForwardAuthToken: true
            Name: incident-management-2601-srv-api
            ProxyType: Internet
            Type: HTTP
            URL: ~{srv-api/srv-url}
          existing_destinations_policy: update
      
  requires:
  - name: srv-api
- name: incident-management-2601_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: incident-management-2601-html5-app-host-service
    service-plan: app-host
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
